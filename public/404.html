<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PayRus</title>
    <!-- GitHub Pages serves this for any unknown path under /payrus/ — that
         includes every real client-side route on a deep link or refresh.
         Redirect to index.html with the path encoded in the query string;
         index.html's inline script decodes it back via history.replaceState.
         https://github.com/rafgraph/spa-github-pages -->
    <script>
      var pathSegmentsToKeep = 1; // "/payrus"
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
